name: CI

# All four provider suites run here, and publish waits for all of them (3.12.0). Before, PostgreSQL and MySQL had
# workflows of their own (PostgreSQL triggered only on main and development/**, never master or release/**), nothing
# ran the SQLite suite, and publish waited for SQL Server alone.
on:
  push:
    branches: [ main, master, development/**, release/** ]
  pull_request:
    branches: [ main, master, development/** ]
  # A manual run is a publish dry run: every job runs, publish signs, packs and verifies, and nothing is pushed
  # (the push step runs only on a push to master, whatever this input says; it is informational).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (always true for a manual run: the push step never runs outside a push to master)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: |
        dotnet build Funcular.Data.Orm.SqlServer/Funcular.Data.Orm.SqlServer.csproj --configuration Release --no-restore
        dotnet build Funcular.Data.Orm.SqlServer.Tests/Funcular.Data.Orm.SqlServer.Tests.csproj --configuration Release --no-restore

  test-net8:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build .NET 8 tests
      run: dotnet build Funcular.Data.Orm.SqlServer.Tests/Funcular.Data.Orm.SqlServer.Tests.csproj --configuration Release --no-restore
    - name: Setup LocalDB
      run: |
        sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "IF DB_ID('funky_db') IS NOT NULL DROP DATABASE funky_db;"
        sqlcmd -S "(localdb)\MSSQLLocalDB" -i Database\integration_test_db.sql
        sqlcmd -S "(localdb)\MSSQLLocalDB" -d funky_db -i Database\integration_test_data.sql
    - name: Run tests with filter
      run: dotnet test Funcular.Data.Orm.SqlServer.Tests/Funcular.Data.Orm.SqlServer.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName!~PerformanceTests & FullyQualifiedName!~EntityFramework" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
    # An inconclusive (a missing database, missing data) is NotExecuted in the TRX and dotnet test still exits 0. The
    # allowed ones: a bool in a SELECT is a syntax error on SQL Server (by design); no PostgreSQL on this runner; the
    # seed has no populated remote chain for RemoteFeaturesTests.
    - name: Every test ran (the TRX gate)
      shell: pwsh
      run: |
        ./.github/scripts/Assert-TestsRan.ps1 -Trx TestResults/test-results.trx -Allow @(
          'Funcular.Data.Orm.SqlServer.Tests.CapturedValues.SqlServerCapturedValueTests.Projection_BoolValue_GetsCSharpsValue',
          'Funcular.Data.Orm.SqlServer.Tests.Caching.ProviderScopedCacheSqlServerTests.SqlServerThenPostgreSql_SameEntity_BothQueriesRun',
          'Funcular.Data.Orm.SqlServer.Tests.RemoteFeaturesTests.RemoteProperty_IsPopulated_OnQuery')
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sqlserver-test-results
        path: '**/test-results.trx'

  # The SQLite suite needs no service. It runs on Windows, where it is run locally before every release.
  test-sqlite:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore Funcular.Data.Orm.Sqlite.Tests/Funcular.Data.Orm.Sqlite.Tests.csproj
    - name: Build
      run: dotnet build Funcular.Data.Orm.Sqlite.Tests/Funcular.Data.Orm.Sqlite.Tests.csproj --configuration Release --no-restore
    - name: Run SQLite tests
      run: dotnet test Funcular.Data.Orm.Sqlite.Tests/Funcular.Data.Orm.Sqlite.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
    - name: Every test ran (the TRX gate)
      shell: pwsh
      run: |
        ./.github/scripts/Assert-TestsRan.ps1 -Trx TestResults/test-results.trx -Allow @()
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-test-results
        path: '**/test-results.trx'

  # Moved from build-and-test-postgresql.yml (3.12.0); the service and scripts are unchanged, and the command gains the TRX's
  # --results-directory for the gate.
  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: funky_db
          POSTGRES_USER: funky_user
          POSTGRES_PASSWORD: funky_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FUNKY_PG_CONNECTION: "Host=localhost;Port=5432;Database=funky_db;Username=funky_user;Password=funky_password"
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Create PostgreSQL schema
      run: |
        PGPASSWORD=funky_password psql -h localhost -U funky_user -d funky_db \
          -f Database/PostgreSql/integration_test_db.sql
    - name: Seed PostgreSQL test data
      run: |
        PGPASSWORD=funky_password psql -h localhost -U funky_user -d funky_db \
          -f Database/PostgreSql/integration_test_data.sql
    - name: Restore dependencies
      run: dotnet restore Funcular.Data.Orm.PostgreSql.Tests/Funcular.Data.Orm.PostgreSql.Tests.csproj
    - name: Build
      run: dotnet build Funcular.Data.Orm.PostgreSql.Tests/Funcular.Data.Orm.PostgreSql.Tests.csproj --no-restore --configuration Release
    - name: Run PostgreSQL integration tests
      run: >
        dotnet test
        Funcular.Data.Orm.PostgreSql.Tests/Funcular.Data.Orm.PostgreSql.Tests.csproj
        --no-build --configuration Release --verbosity normal
        --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
    # Allowed: the seed has no populated remote chain for these three (from the PostgreSQL workflow's runs before 3.12.0).
    - name: Every test ran (the TRX gate)
      shell: pwsh
      run: |
        ./.github/scripts/Assert-TestsRan.ps1 -Trx TestResults/test-results.trx -Allow @(
          'Funcular.Data.Orm.PostgreSql.Tests.PostgreSqlRemoteFeaturesTests.RemoteProperty_IsPopulated_OnQuery',
          'Funcular.Data.Orm.PostgreSql.Tests.PostgreSqlRemoteFeaturesTests.RemoteKey_IsPopulated_OnQuery',
          'Funcular.Data.Orm.PostgreSql.Tests.PostgreSqlRemoteFeaturesTests.CanFilterBy_RemoteProperty')
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: postgresql-test-results
        path: '**/test-results.trx'

  # Moved from build-and-test-mysql.yml (3.12.0); the service, scripts and filter are unchanged, and the command gains the
  # TRX's --results-directory for the gate.
  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: funky_db
          MYSQL_USER: funky_user
          MYSQL_PASSWORD: funky_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Tests connect as root so schema/seed and all privileges are available in the ephemeral CI DB.
      FUNKY_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=funky_db;User ID=root;Password=root;GuidFormat=Char36;AllowUserVariables=true;"
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Create MySQL schema
      run: mysql -h 127.0.0.1 -P 3306 -uroot -proot funky_db < Database/MySql/integration_test_db.sql
    - name: Restore dependencies
      run: dotnet restore Funcular.Data.Orm.MySql.Tests/Funcular.Data.Orm.MySql.Tests.csproj
    - name: Build
      run: dotnet build Funcular.Data.Orm.MySql.Tests/Funcular.Data.Orm.MySql.Tests.csproj --no-restore --configuration Release
    - name: Run MySQL tests
      run: >
        dotnet test
        Funcular.Data.Orm.MySql.Tests/Funcular.Data.Orm.MySql.Tests.csproj
        --no-build --configuration Release --verbosity normal
        --filter "FullyQualifiedName!~PerformanceTests & FullyQualifiedName!~EntityFramework"
        --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
    - name: Every test ran (the TRX gate)
      shell: pwsh
      run: |
        ./.github/scripts/Assert-TestsRan.ps1 -Trx TestResults/test-results.trx -Allow @()
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mysql-test-results
        path: '**/test-results.trx'

  # 3.14.0: the .NET Framework suite. VS MSBuild, because `dotnet build` leaves System.Memory.dll out of the net48 output;
  # vstest.console from the VS install (it has no playlist switch, so the filter is the same the other jobs use).
  # The build is public-signed here, as every test job's is (no private key): the strong-name bypass loads it.
  test-net48:
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup LocalDB
      run: |
        sqlcmd -S "(localdb)\MSSQLLocalDB" -Q "IF DB_ID('funky_db') IS NOT NULL DROP DATABASE funky_db;"
        sqlcmd -S "(localdb)\MSSQLLocalDB" -i Database\integration_test_db.sql
        sqlcmd -S "(localdb)\MSSQLLocalDB" -d funky_db -i Database\integration_test_data.sql
    - name: Build the .NET Framework tests (VS MSBuild)
      run: msbuild Funcular.Data.Orm.SqlServer.Tests.NetFramework\Funcular.Data.Orm.SqlServer.Tests.NetFramework.csproj -restore -t:Rebuild -p:Configuration=Release
    - name: Run the .NET Framework tests (vstest.console)
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vstest = & $vswhere -latest -products * -find 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'vstest.console.exe was not found by vswhere' }
        & $vstest Funcular.Data.Orm.SqlServer.Tests.NetFramework\bin\Release\Funcular.Data.Orm.SqlServer.Tests.NetFramework.dll /Platform:x64 "/TestCaseFilter:FullyQualifiedName!~PerformanceTests" "/Logger:trx;LogFileName=test-results.trx" /ResultsDirectory:TestResults
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Every test ran (the TRX gate)
      shell: pwsh
      run: |
        ./.github/scripts/Assert-TestsRan.ps1 -Trx TestResults/test-results.trx
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: net48-test-results
        path: '**/test-results.trx'

  # 3.14.0: the package is fully strong-name signed with the key from the FUNKYORM_SNK_BASE64 secret (the owner's
  # D:\func\keys\FuncularLabs.snk, base64), on the build (which produces what pack packs: with GeneratePackageOnBuild,
  # `dotnet pack` does not build) and on the pack (so a pack-triggered build would sign too), and every DLL in the nupkg
  # is verified with sn.exe before the push. The job also runs on a manual workflow_dispatch from any branch, as a dry
  # run; only the push step is limited to a push to master, so a manual run can never publish.
  publish:
    runs-on: windows-latest
    needs: [test-net8, test-sqlite, test-postgresql, test-mysql, test-net48]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Materialize the strong-name key (fails if the secret is absent)
      shell: pwsh
      env:
        FUNKYORM_SNK_BASE64: ${{ secrets.FUNKYORM_SNK_BASE64 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:FUNKYORM_SNK_BASE64)) { throw "The FUNKYORM_SNK_BASE64 secret is not set: the package must be fully signed, so nothing is packed." }
        $path = Join-Path $env:RUNNER_TEMP 'FuncularLabs.snk'
        [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:FUNKYORM_SNK_BASE64))
        "FUNKYORM_KEY_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build (fully signed)
      run: dotnet build Funcular.Data.Orm.SqlServer/Funcular.Data.Orm.SqlServer.csproj --configuration Release --no-restore -p:FunkyOrmKeyFile=${{ env.FUNKYORM_KEY_FILE }}

    - name: Pack (fully signed)
      run: dotnet pack Funcular.Data.Orm.SqlServer/Funcular.Data.Orm.SqlServer.csproj --configuration Release --output nupkgs -p:FunkyOrmKeyFile=${{ env.FUNKYORM_KEY_FILE }}

    - name: Verify every DLL in the package is strong-name signed
      shell: pwsh
      run: ./tools/signing/Verify-StrongNames.ps1 -NupkgDirectory nupkgs -ExpectedToken 0650eba294fc9e3f

    - name: Push to NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        $packages = Get-ChildItem -Path nupkgs -Filter *.nupkg -File
        if (-not $packages) {
          throw "No NuGet packages were found in the nupkgs directory."
        }
        # A merge that doesn't change the version (docs, CI, tools) finds that version already on nuget.org.
        # --skip-duplicate leaves the published package alone and keeps the run green; it also means a
        # forgotten version bump publishes nothing without failing the run.
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key ${{ secrets.NUGET_PUBLISH_SECRET }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
